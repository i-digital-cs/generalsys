apply plugin: 'com.android.application'

def releaseKeystorePropsFile = System.getenv('GH_ANDROID_RELEASE_KEYSTORE_PROPS')
        ? file(System.getenv('GH_ANDROID_RELEASE_KEYSTORE_PROPS'))
        : file("${System.getProperty('user.home')}/.gnrl-android-signing/keystore.properties")
def releaseKeystoreProps = new Properties()
def hasReleaseKeystore = releaseKeystorePropsFile.exists()
if (hasReleaseKeystore) {
    releaseKeystorePropsFile.withInputStream { releaseKeystoreProps.load(it) }
}

android {
    namespace "net.genral.generalhouse"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.genral.generalhouse"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Flavor names must not start with "test" (Android Gradle Plugin reserved).
    // sandbox  => GNRL Operations TEST  (generalsys.idigital-cs.com)
    // production => GNRL Operations LIVE (system.genral.net)
    flavorDimensions "environment"
    productFlavors {
        sandbox {
            dimension "environment"
            applicationIdSuffix ".test"
            resValue "string", "app_name", "GNRL Operations TEST"
            resValue "string", "title_activity_main", "GNRL Operations TEST"
            buildConfigField "String", "GH_ENV", '"TEST"'
            buildConfigField "String", "GH_SERVER_HOST", '"generalsys.idigital-cs.com"'
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "GNRL Operations"
            resValue "string", "title_activity_main", "GNRL Operations"
            buildConfigField "String", "GH_ENV", '"LIVE"'
            buildConfigField "String", "GH_SERVER_HOST", '"system.genral.net"'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(releaseKeystoreProps['storeFile'])
                storePassword releaseKeystoreProps['storePassword']
                keyAlias releaseKeystoreProps['keyAlias']
                keyPassword releaseKeystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
